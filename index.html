<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>NOU ANDEMIK</title>

  <meta
    name="description"
    content="NOU ANDEMIK keeps our endemic flora rooted for generations to come."
  >

  <meta
    name="robots"
    content="index, follow"
  >

  <link
    rel="canonical"
    href="https://nou.andemik.com/"
  >

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="/favicon.png"
  >

  <!-- Open Graph -->
  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:title"
    content="NOU ANDEMIK — Endemic Flora"
  >

  <meta
    property="og:description"
    content="NOU ANDEMIK keeps our endemic flora rooted for generations to come."
  >

  <meta
    property="og:url"
    content="https://nou.andemik.com/"
  >

  <meta
    property="og:image"
    content="https://nou.andemik.com/og.jpg"
  >

  <meta
    property="og:site_name"
    content="NOU ANDEMIK"
  >

  <!-- Twitter / X -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="NOU ANDEMIK — Endemic Flora"
  >

  <meta
    name="twitter:description"
    content="NOU ANDEMIK keeps our endemic flora rooted for generations to come."
  >

  <meta
    name="twitter:image"
    content="https://nou.andemik.com/og.jpg"
  >

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "NOU ANDEMIK",
    "url": "https://nou.andemik.com/"
  }
  </script>

  <style>
    :root {
      --background: #ffffff;
      --text: #171717;

      --page-margin: clamp(20px, 4vw, 64px);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--background);
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100svh;

      background: var(--background);
      color: var(--text);

      font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

      font-weight: 400;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
    }

    .site {
      min-height: 100svh;

      display: grid;
      grid-template-rows: auto 1fr auto;

      padding:
        var(--page-margin)
        var(--page-margin)
        calc(var(--page-margin) * 0.8);
    }

    /* -------------------------
       Header
    ------------------------- */

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .wordmark,
    .menu-link {
      color: var(--text);

      font-size: 14px;
      line-height: 1;

      font-weight: 400;
      letter-spacing: 0.08em;

      text-decoration: none;
    }

    .header-right {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .wordmark:hover,
    .menu-link:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* -------------------------
       Main
    ------------------------- */

    main {
      min-height: 0;

      display: flex;
      align-items: center;
    }

    .intro {
      max-width: 520px;
    }

    .intro h1 {
      margin: 0 0 12px;

      font-size: clamp(28px, 5vw, 56px);
      line-height: 0.95;

      font-weight: 400;
      letter-spacing: -0.04em;
    }

    .intro p {
      max-width: 420px;

      margin: 0;

      font-size: 14px;
      line-height: 1.5;

      letter-spacing: 0.01em;
    }

    /* -------------------------
       Footer
    ------------------------- */

    .footer {
      display: grid;
      grid-template-columns: 1fr auto;

      align-items: end;

      color: var(--text);

      font-size: 10px;
      line-height: 1.2;

      font-weight: 400;
      letter-spacing: 0.04em;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .footer-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .footer a {
      color: var(--text);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* -------------------------
       Focus
    ------------------------- */

    .wordmark:focus-visible,
    .menu-link:focus-visible,
    .footer a:focus-visible {
      outline: 1px solid var(--text);
      outline-offset: 4px;
    }

    .footer-dot {
      user-select: none;
    }

    /* -------------------------
       Mobile
    ------------------------- */

    @media (max-width: 600px) {
      :root {
        --page-margin: 20px;
      }

      .wordmark,
      .menu-link {
        font-size: 14px;
      }

      .intro h1 {
        font-size: 36px;
      }

      .intro p {
        font-size: 14px;
      }

      .footer {
        font-size: 10px;
      }

      .footer-right {
        gap: 8px;
      }
    }

    @media (max-width: 400px) {
      .header-right {
        gap: 8px;
      }

      .footer {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .footer-right {
        justify-content: flex-start;
      }
    }

    @media (max-width: 340px) {
      :root {
        --page-margin: 16px;
      }

      .wordmark,
      .menu-link {
        font-size: 13px;
      }

      .intro h1 {
        font-size: 32px;
      }

      .footer {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <div class="site">

    <header class="header">

      <a
        class="wordmark"
        href="/"
        aria-label="NOU ANDEMIK home"
      >
        NOU ANDEMIK
      </a>

      <div class="header-right">

        <a
          class="menu-link"
          href="/nursery.html"
          aria-label="NOU ANDEMIK Nursery"
        >
          NURSERY
        </a>

        <a
          class="menu-link"
          href="mailto:nursery@andemik.com"
          aria-label="Contact NOU ANDEMIK"
        >
          CONTACT
        </a>

      </div>

    </header>


    <main>

      <section
        class="intro"
        aria-labelledby="page-title"
      >

        <h1 id="page-title">
          NOU ANDEMIK
        </h1>

        <p>
          Keeping our endemic flora rooted for generations to come.
        </p>

      </section>

    </main>


    <footer class="footer">

      <div class="footer-left">
        <span>© 2026</span>
        <span>NOU ANDEMIK</span>
      </div>

      <nav
        class="footer-right"
        aria-label="Legal"
      >

        <a href="/terms.html">
          Terms
        </a>

        <span
          class="footer-dot"
          aria-hidden="true"
        >
          ·
        </span>

        <a href="/privacy.html">
          Privacy
        </a>

      </nav>

    </footer>

  </div>

</body>

</html>
