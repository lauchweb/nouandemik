<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>NOU ANDEMIK — Native Flora</title>

  <meta
    name="description"
    content="NOU ANDEMIK is dedicated to keeping our native flora rooted for generations to come."
  >

  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#ffffff">

  <link rel="canonical" href="https://nou.andemik.com/">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="NOU ANDEMIK — Native Flora">
  <meta
    property="og:description"
    content="NOU ANDEMIK is dedicated to keeping our native flora rooted for generations to come."
  >
  <meta property="og:url" content="https://nou.andemik.com/">
  <meta property="og:image" content="https://nou.andemik.com/og.jpg">
  <meta property="og:image:alt" content="NOU ANDEMIK">
  <meta property="og:site_name" content="NOU ANDEMIK">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="NOU ANDEMIK — Native Flora">
  <meta
    name="twitter:description"
    content="NOU ANDEMIK is dedicated to keeping our native flora rooted for generations to come."
  >
  <meta name="twitter:image" content="https://nou.andemik.com/og.jpg">

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "NOU ANDEMIK",
    "url": "https://nou.andemik.com/"
  }
  </script>

  <style>

    :root {
      --background: #ffffff;
      --text: #171717;
      --accent: #617451;

      --page-margin: clamp(20px, 4vw, 64px);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--background);
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100svh;

      background: var(--background);
      color: var(--text);

      font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

      font-weight: 400;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
    }

    .site {
      min-height: 100svh;

      display: grid;
      grid-template-rows: auto 1fr auto;

      padding:
        var(--page-margin)
        var(--page-margin)
        calc(var(--page-margin) * 0.8);
    }

    /* Header */

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .wordmark,
    .menu-link {
      font-family: inherit;
      font-size: 14px;
      line-height: 1;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-decoration: none;
    }

    .wordmark {
      color: var(--accent);
      font-weight: 700;
    }

    .menu-link {
      color: var(--text);
    }

    .header-right {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .wordmark:hover,
    .menu-link:hover,
    .footer a:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* Main */

    main {
      min-height: 0;

      display: grid;
      grid-template-rows: 1fr auto 1fr;

      align-items: center;
    }

    .hero-image {
      display: block;

      justify-self: center;

      width: min(58%, 500px);
      max-height: 27svh;

      height: auto;
      object-fit: contain;

      margin-inline: auto;
    }

    .tagline {
      max-width: 420px;

      margin: 32px auto 0;

      font-family: inherit;
      font-size: 14px;
      line-height: 1.7;
      font-weight: 400;
      letter-spacing: 0.01em;

      text-align: center;
    }

    /* Footer */

    .footer {
      display: grid;
      grid-template-columns: 1fr auto;

      align-items: end;

      color: var(--text);

      font-family: inherit;
      font-size: 10px;
      line-height: 1.2;
      font-weight: 400;
      letter-spacing: 0.04em;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .footer-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .footer a {
      color: var(--text);
      text-decoration: none;
    }

    .footer .contact-link {
      color: var(--accent);
      font-weight: 700;
    }

    .footer-dot {
      user-select: none;
    }

    /* Focus */

    .wordmark:focus-visible,
    .menu-link:focus-visible,
    .footer a:focus-visible {
      outline: 1px solid var(--text);
      outline-offset: 4px;
    }

    /* Mobile */

    @media (max-width: 600px) {

      :root {
        --page-margin: 20px;
      }

      .wordmark,
      .menu-link {
        font-size: 12px;
      }

      .header-right {
        gap: 8px;
      }

      .hero-image {
        justify-self: center;

        width: 78%;
        max-height: 24svh;

        margin-inline: auto;
      }

      .tagline {
        max-width: 300px;

        margin-top: 28px;

        font-size: 12px;
        line-height: 1.7;
      }

      .footer {
        font-size: 9px;
      }

      .footer-right {
        gap: 8px;
      }
    }

    @media (max-width: 400px) {

      .wordmark,
      .menu-link {
        font-size: 11px;
      }

      .header-right {
        gap: 7px;
      }

      .footer {
        font-size: 8px;
      }

      .footer-right {
        gap: 7px;
      }
    }

    @media (max-width: 340px) {

      :root {
        --page-margin: 16px;
      }

      .wordmark,
      .menu-link {
        font-size: 10px;
      }

      .footer {
        font-size: 8px;
      }
    }

  </style>
</head>

<body>

  <div class="site">

    <!-- Header -->

    <header class="header">

      <a
        class="wordmark"
        href="/"
        aria-label="NOU ANDEMIK home"
      >
        NOU ANDEMIK
      </a>

      <nav
        class="header-right"
        aria-label="Main navigation"
      >

        <a
          class="menu-link"
          href="/about.html"
        >
          ABOUT
        </a>

      </nav>

    </header>

    <!-- Main -->

    <main aria-label="NOU ANDEMIK">

      <img
        class="hero-image"
        src="/home.jpg"
        fetchpriority="high"
        decoding="async"
      >

      <p class="tagline">
        Keeping our native flora rooted for generations to come.
      </p>

    </main>

    <!-- Footer -->

    <footer class="footer">

      <div class="footer-left">
        <span>© 2026</span>
        <span>NOU ANDEMIK</span>
      </div>

      <nav
        class="footer-right"
        aria-label="Footer navigation"
      >

        <a
          class="contact-link"
          href="mailto:nursery@andemik.com"
        >
          Contact
        </a>

        <a href="/terms.html">
          Terms
        </a>

        <span class="footer-dot" aria-hidden="true">
          ·
        </span>

        <a href="/privacy.html">
          Privacy
        </a>

      </nav>

    </footer>

  </div>

</body>

</html>
